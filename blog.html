
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>लेख आणि ब्लॉग | मंदार लेखणी</title>
<meta name="description" content="मंदार लेखणीचे मराठी साहित्य, सायबर सुरक्षा, सायबर कायदा आणि डिजिटल फॉरेन्सिक्स विषयांवरील लेख.">
<link rel="stylesheet" href="./style.css">

<style>
.blog-wrap{width:min(1100px,92%);margin:40px auto}
.blog-head{text-align:center;margin:35px 0}
.blog-tools{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:25px 0}
.blog-tools input,.blog-tools select{
  width:100%;padding:14px;border:1px solid #cbd5e1;
  border-radius:9px;font-size:16px;background:#fff;color:#071a35
}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.post-card{border:1px solid #344b68;border-radius:14px;padding:22px;background:#142f52}
.post-card h2{font-size:21px;margin:10px 0;color:#f4d98d}
.post-meta{font-size:13px;color:#c5d0df}
.post-card p{color:#edf2fa;margin:12px 0}
.read-link{display:inline-block;margin-top:10px;padding:10px 16px;background:#e5bd62;color:#071a35;border-radius:7px;font-weight:bold}
.blog-error{padding:18px;background:#fff4e5;border-radius:8px;color:#071a35}
.no-results{text-align:center;padding:25px;color:#edf2fa}
@media(max-width:600px){
  .blog-tools{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
  <div class="container nav">
    <a class="brand" href="./index.html">
      <div>मंदार लेखणी<span>शब्दांतून मनाचा प्रवास...</span></div>
    </a>
    <nav>
      <a href="./index.html">मुख्यपृष्ठ</a>
      <a href="./index.html#books">पुस्तके</a>
      <a href="./blog.html">ब्लॉग</a>
      <a href="./index.html#contact">संपर्क</a>
    </nav>
  </div>
</header>

<main class="blog-wrap">
  <div class="blog-head">
    <h1>लेख आणि ब्लॉग</h1>
    <p>मराठी साहित्य • Cyber Security • Cyber Law • Digital Forensics</p>
  </div>

  <div class="blog-tools">
    <input
      type="search"
      id="blog-search"
      placeholder="लेखाचे नाव किंवा शब्द शोधा..."
      aria-label="लेख शोधा"
    >

    <select id="category-filter" aria-label="विषयानुसार लेख निवडा">
      <option value="">सर्व विषय</option>
    </select>
  </div>

  <div id="posts-list" class="blog-grid">
    <p>लेख लोड होत आहेत...</p>
  </div>

  <p style="margin-top:35px">
    <a href="./index.html">← मुख्य वेबसाइटवर परत जा</a>
  </p>
</main>

<footer>
  <div class="container">
    <p>© <span id="year"></span> मंदार लेखणी | लेखक: मंदार कारंडे</p>
  </div>
</footer>

<script src="./blog.js"></script>
</body>
</html>
