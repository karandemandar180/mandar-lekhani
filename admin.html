
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | मंदार लेखणी</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#071a35;color:white;padding:20px}
header h2{margin:0}
.container{width:min(900px,94%);margin:25px auto}
.card{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 15px #00000010}
h3{color:#071a35}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd2dc;border-radius:7px;font-size:15px}
textarea{min-height:100px;resize:vertical}
button{padding:11px 15px;border:0;border-radius:7px;background:#071a35;color:white;cursor:pointer;margin:5px}
button:hover{background:#c49a45;color:#071a35}
.secondary{background:#e8edf5;color:#071a35}
.danger{background:#a52626}
.edit{background:#176b45}
#preview{border:1px solid #ddd;padding:15px;border-radius:8px;line-height:1.7;overflow-wrap:anywhere}
.status{padding:12px;background:#edf7ed;border-radius:7px;margin-top:12px}
.article-item{padding:14px;border:1px solid #ddd;border-radius:9px;margin:12px 0}
.article-item h4{margin:0 0 8px;color:#071a35}
.actions{display:flex;flex-wrap:wrap;gap:5px}
</style>
</head>
<body>

<header>
<h2>मंदार लेखणी – Admin Dashboard</h2>
<p>Article Publishing Centre</p>
</header>

<div class="container">

<div class="card">
<h3 id="form-heading">नवीन लेख तयार करा</h3>

<label>लेखाचे शीर्षक</label>
<input id="title" placeholder="लेखाचे शीर्षक">

<label>Category</label>
<select id="category">
<option>Cyber Security</option>
<option>Cyber Law</option>
<option>Digital Forensics</option>
<option>Marathi Literature</option>
<option>Poetry</option>
<option>Technology</option>
<option>English Articles</option>
</select>

<label>तारीख</label>
<input type="date" id="date">

<label>लेखक</label>
<input id="author" value="मंदार कारंडे">

<label>Image URL (ऐच्छिक)</label>
<input id="image" placeholder="https://example.com/image.jpg">

<label>लेखाचा परिचय</label>
<textarea id="excerpt" placeholder="लेखाचा थोडक्यात परिचय"></textarea>

<label>संपूर्ण लेख – प्रत्येक परिच्छेदामध्ये रिकामी ओळ ठेवा</label>
<textarea id="content" rows="10" placeholder="पहिला परिच्छेद...

दुसरा परिच्छेद..."></textarea>

<button onclick="previewArticle()">Preview</button>
<button onclick="saveArticle()">लेख Save करा</button>
<button class="secondary" onclick="clearForm()">Clear</button>
<button class="secondary" id="cancel-edit" onclick="cancelEdit()" hidden>Cancel Edit</button>
</div>

<div class="card">
<h3>लेखाचा Preview</h3>
<div id="preview">येथे लेखाचा Preview दिसेल.</div>
</div>

<div class="card">
<h3>Published / Loaded Articles</h3>
<input id="article-search" placeholder="लेख शोधा..." oninput="renderArticles()">
<div id="article-list">लेख Load होत आहेत...</div>
</div>

<div class="card">
<h3>Publishing</h3>
<p>बदललेली posts.json डाउनलोड करून GitHub वरील जुनी फाइल Replace करा आणि Commit करा.</p>
<button onclick="downloadJSON()">Download posts.json</button>
<button class="secondary" onclick="loadExisting()">जुने लेख पुन्हा Load करा</button>
<div id="status"></div>
</div>

</div>

<script>
"use strict";

let posts = [];
let editingId = null;
let dirty = false;

const $ = id => document.getElementById(id);

$("date").value = new Date().toISOString().slice(0,10);

function status(message) {
  $("status").textContent = message;
  $("status").className = "status";
}

function makePost() {
  const title = $("title").value.trim();
  const content = $("content").value
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(Boolean);

  if (!title || !content.length) {
    alert("लेखाचे शीर्षक आणि संपूर्ण लेख भरा.");
    return null;
  }

  const image = $("image").value.trim();
  if (image && !/^https?:\/\/\S+$/i.test(image)) {
    alert("Image URL योग्य HTTP किंवा HTTPS लिंक असावी.");
    return null;
  }

  return {
    id: editingId || ("article-" + Date.now()),
    title,
    category: $("category").value,
    date: $("date").value,
    author: $("author").value.trim() || "मंदार कारंडे",
    image,
    excerpt: $("excerpt").value.trim(),
    content
  };
}

function previewArticle() {
  const post = makePost();
  if (!post) return;

  const box = $("preview");
  box.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = post.title;
  box.appendChild(heading);

  const meta = document.createElement("p");
  meta.textContent = post.category + " | " + post.date + " | " + post.author;
  box.appendChild(meta);

  const excerpt = document.createElement("p");
  excerpt.textContent = post.excerpt;
  box.appendChild(excerpt);

  if (post.image) {
    const img = document.createElement("img");
    img.src = post.image;
    img.alt = post.title;
    img.style.maxWidth = "100%";
    img.onerror = () => img.remove();
    box.appendChild(img);
  }

  post.content.forEach(text => {
    const p = document.createElement("p");
    p.textContent = text;
    box.appendChild(p);
  });
}

async function loadExisting() {
  if (dirty && !confirm("तुमचे न जतन केलेले बदल रद्द करून JSON पुन्हा Load करायचे?")) return;

  try {
    const response = await fetch("./posts.json?refresh=" + Date.now());
    if (!response.ok) throw new Error("Load failed");

    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Invalid JSON");

    posts = data;
    editingId = null;
    dirty = false;
    clearForm();
    renderArticles();
    status(posts.length + " लेख Load झाले.");
  } catch (error) {
    status("लेख Load झाले नाहीत. Dashboard वेबसाइटवरून उघडा आणि posts.json तपासा.");
  }
}

function saveArticle() {
  const post = makePost();
  if (!post) return;

  const existingIndex = posts.findIndex(p => p.id === post.id);

  if (existingIndex >= 0) {
    posts[existingIndex] = post;
    status("लेख Update झाला. Download posts.json करा.");
  } else {
    if (posts.some(p => p.title === post.title) &&
        !confirm("याच शीर्षकाचा लेख आहे. तरी नवीन लेख जोडायचा?")) return;

    posts.push(post);
    status("नवीन लेख जोडला. Download posts.json करा.");
  }

  dirty = true;
  editingId = null;
  clearForm();
  renderArticles();
}

function editArticle(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;

  editingId = id;
  $("title").value = post.title || "";
  $("category").value = post.category || "Cyber Security";
  $("date").value = post.date || "";
  $("author").value = post.author || "मंदार कारंडे";
  $("image").value = post.image || "";
  $("excerpt").value = post.excerpt || "";
  $("content").value = (post.content || []).join("\n\n");

  $("form-heading").textContent = "लेख Edit करा";
  $("cancel-edit").hidden = false;
  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit() {
  editingId = null;
  clearForm();
}

function deleteArticle(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;

  if (!confirm('"' + post.title + '" हा लेख Delete करायचा आहे का?')) return;

  posts = posts.filter(p => p.id !== id);
  if (editingId === id) cancelEdit();

  dirty = true;
  renderArticles();
  status("लेख यादीतून Delete झाला. कायमचा बदल करण्यासाठी Download आणि GitHub Commit करा.");
}

function renderArticles() {
  const list = $("article-list");
  const query = $("article-search").value.trim().toLocaleLowerCase();

  list.replaceChildren();

  const filtered = posts.filter(p =>
    [p.title,p.category,p.author].join(" ").toLocaleLowerCase().includes(query)
  );

  if (!filtered.length) {
    list.textContent = "लेख सापडला नाही.";
    return;
  }

  filtered.forEach(post => {
    const item = document.createElement("div");
    item.className = "article-item";

    const heading = document.createElement("h4");
    heading.textContent = post.title;
    item.appendChild(heading);

    const meta = document.createElement("p");
    meta.textContent = post.category + " | " + post.date;
    item.appendChild(meta);

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "Edit";
    edit.onclick = () => editArticle(post.id);

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Delete";
    del.onclick = () => deleteArticle(post.id);

    actions.append(edit,del);
    item.appendChild(actions);
    list.appendChild(item);
  });
}

function downloadJSON() {
  if (!posts.length) {
    alert("प्रथम जुने लेख Load करा.");
    return;
  }

  const blob = new Blob(
    [JSON.stringify(posts,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "posts.json";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url),1000);

  dirty = false;
  status("posts.json डाउनलोड झाले. GitHub वर Replace करून Commit करा.");
}

function clearForm() {
  ["title","image","excerpt","content"].forEach(id => $(id).value = "");
  $("date").value = new Date().toISOString().slice(0,10);
  $("author").value = "मंदार कारंडे";
  $("category").value = "Cyber Security";
  $("form-heading").textContent = "नवीन लेख तयार करा";
  $("cancel-edit").hidden = true;
  $("preview").textContent = "येथे लेखाचा Preview दिसेल.";
}

loadExisting();
</script>
</body>
</html>
